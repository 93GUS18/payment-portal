<div class="payment-container">
    <div class="header">
        <h2>Payments Management</h2>
        <button mat-raised-button [matMenuTriggerFor]="actionsMenu" [disabled]="isLoading">
            <mat-icon>more_vert</mat-icon>
            Actions
        </button>
        <mat-menu #actionsMenu="matMenu">
            <button mat-menu-item (click)="refreshData()">
                <mat-icon>refresh</mat-icon>
                <span>Refresh</span>
            </button>
            <button mat-menu-item (click)="addPayment()">
                <mat-icon>add</mat-icon>
                <span>Add Payment</span>
            </button>
        </mat-menu>
    </div>

    <div class="table-container">
        <div class="loading-shade" *ngIf="isLoading">
            <mat-spinner diameter="50"></mat-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

            <!-- Payment ID Column -->
            <ng-container matColumnDef="Reference">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Reference </th>
                <td mat-cell *matCellDef="let payment"> {{payment.reference}} </td>
            </ng-container>

            <!-- Customer Name Column -->
            <ng-container matColumnDef="Currency">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Currency </th>
                <td mat-cell *matCellDef="let payment"> {{getCurrencyLabel(payment.currency)}} </td>
            </ng-container>

            <!-- Amount Column -->
            <ng-container matColumnDef="Amount">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
                <td mat-cell *matCellDef="let payment"> {{payment.amount}} </td>
            </ng-container>

            <!-- Date Column -->
            <ng-container matColumnDef="CreatedAt">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                <td mat-cell *matCellDef="let payment"> {{payment.createdAt | date:'short':'local'}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let payment">
                    <button mat-icon-button color="primary" (click)="viewPayment(payment)" [disabled]="isLoading">
                        <mat-icon>visibility</mat-icon>
                    </button>
                    <button mat-icon-button color="accent" (click)="editPayment(payment)" [disabled]="isLoading">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deletePayment(payment)" [disabled]="isLoading">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.row-highlight]="selectedRow === row">
            </tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    <div class="no-data">
                        <mat-icon>inbox</mat-icon>
                        <p>No payment data available</p>
                    </div>
                </td>
            </tr>
        </table>

        <mat-paginator #paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" showFirstLastButtons
            aria-label="Select page of payments">
        </mat-paginator>
    </div>
</div>
